version: 2

models:
  - name: stg_google_sheets__budget
    description: "This table contains the row data of products PLUS 2 columns of SURROGATE KEY, with the columns _row, month, product_id. Actually, this is ONLY A TEST, to use 2 different methods to create a SK. It doesn't make sense to have both columnas at the same time, but since it's just a test, I'll keep them"
    columns:
      - name: _row
        data_type: number
        description: "unique field, it's a count row"

      - name: prod_per_month
        data_type: varchar
        description: "SURROGATE KEY, created by the function 'md5', composed BY the columns _row, month, product_id"

      - name: prod_per_month2
        data_type: varchar
        description: "another way to create the same SK, but this time using a macro from dbt_utils"

      - name: quantity
        data_type: number
        description: ""

      - name: month
        data_type: date
        description: ""

      - name: product_id
        data_type: varchar
        description: "there's a product_if for each month"

      - name: _fivetran_synced
        data_type: timestamp_tz
        description: ""

    tests:
      # Add primary key test for the composite key
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - _row
            - month
            - product_id
          config:
            severity: error