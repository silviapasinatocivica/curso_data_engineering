version: 2

models:
  - name: base_google_sheets__budget
    description: "This table contains the row data of products, where each product_id is present for each month"
    columns:
      - name: _row
        data_type: number
        description: "unique field, it's a count row"

      - name: quantity
        data_type: number
        description: ""

      - name: month
        data_type: date
        description: ""

      - name: product_id
        data_type: varchar
        description: "there's a product_if for each month"

      - name: _fivetran_synced
        data_type: timestamp_tz
        description: ""

