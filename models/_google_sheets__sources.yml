version: 2

sources:

  - name: google_sheets # name of the source 
    schema: google_sheets # this is the schema our raw data lives in
    database: SPASINATO_DEMO_BRZ_DB # this is the name of our database

    quoting:
      database: false
      schema: false
      identifier: false

    freshness:
      warn_after: {count: 250, period: day} ##test para que me salga SUCCESS (en casos reales NO quiero freshness con datos de hace 8 meses o un año, claramente)
      error_after: {count: 365, period: day} ##idem

    tables:

      - name: budget
        loaded_at_field: _fivetran_synced
        columns:
          - name: _row
          - name: quantity
          - name: month
          - name: product_id
          - name: _fivetran_synced